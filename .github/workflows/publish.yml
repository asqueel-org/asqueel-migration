name: Build and publish distributions

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "scripts/check_distribution.py"
      - "src/asqueel_migration/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist/*
      - name: Smoke-test wheel and source distribution
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_dir=$(mktemp -d)
            python -m venv "$smoke_dir"
            "$smoke_dir/bin/python" -m pip install "$artifact"
            (cd /tmp && "$smoke_dir/bin/python" -c "import asqueel_migration; from importlib.metadata import version; assert asqueel_migration.__version__ == version('asqueel-migration')")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    if: github.repository == 'asqueel-org/asqueel-migration' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/asqueel-migration
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
