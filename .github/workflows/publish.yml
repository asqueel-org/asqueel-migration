name: Publish to PyPI

"on":
  push:
    tags:
      - 'v*'  # Trigger on version tags (v0.1.0, v1.0.0, etc.)
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag/version mismatch"
          PY

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*

      - name: Smoke-test wheel and sdist installations
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m venv /tmp/release-smoke
            /tmp/release-smoke/bin/python -m pip install "$artifact"
            /tmp/release-smoke/bin/python -c "from genro_sqlmigration import SqlMigrator, StructureValidator, __version__; from importlib.metadata import version; assert __version__ == version('genro-sqlmigration')"
            rm -rf /tmp/release-smoke
          done

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      url: https://pypi.org/p/genro-sqlmigration
    permissions:
      id-token: write  # REQUIRED for Trusted Publisher

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # REQUIRED to create releases

    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --repo='${{ github.repository }}' \
            --title='${{ github.ref_name }}' \
            --generate-notes \
            dist/*
