name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql]"

      - name: Install editor dependencies
        if: matrix.python-version != '3.10'
        run: |
          python -m pip install -e ".[app]"
          python -c "from genro_sqlmigration.app import EditorApp"

      - name: Run unit and SQLite tests
        run: >-
          pytest
          -m "not postgresql and not mysql and not mssql"
          --cov=genro_sqlmigration
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql,app]"

      - name: Ruff
        run: ruff check src tests

      # Becomes blocking when issue #5 closes. Running it now keeps the
      # outstanding typing debt visible without breaking unrelated changes.
      - name: mypy (informational)
        continue-on-error: true
        run: mypy src/genro_sqlmigration

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GNR_TEST_PG_HOST: 127.0.0.1
      GNR_TEST_PG_PORT: "5432"
      GNR_TEST_PG_USER: postgres
      GNR_TEST_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql]"

      - name: Run PostgreSQL integration tests
        run: pytest -m postgresql --no-cov

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MySQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mysql]"

      - name: Run MySQL integration tests
        run: pytest tests/test_migration_mysql.py --no-cov

  mssql:
    name: MSSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MSSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mssql]"

      - name: Run MSSQL integration tests
        run: pytest tests/test_migration_mssql.py --no-cov
